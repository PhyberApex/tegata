# Matches the security:minimumReleaseAgeNpm preset (3 days) so a frozen-lockfile
# install never rejects an entry Renovate was willing to open a PR for.
minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - backend
  - frontend
  - shared

# Install scripts are code from the registry, so only the entries set to true
# below - the ones whose build or postinstall step the install needs - may run
# them; everything else, the entries set to false included, is installed
# without executing anything.
allowBuilds:
  '@nestjs/core': true
  '@swc/core': false
  argon2: true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: false
