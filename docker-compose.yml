# Tegata next to the Authelia it manages. Any TLS-terminating reverse proxy
# works; nothing here is specific to one. Only Tegata is shown in full;
# Authelia's own service, your proxy and the network are whatever your
# deployment already has. The matching Authelia client block is in README.md,
# "Authelia configuration". Proxy examples: examples/.
services:
  tegata:
    image: ghcr.io/phyberapex/tegata:1.0.0
    container_name: tegata
    env_file: .env
    environment:
      - NODE_ENV=production
      - TEGATA_DB_PATH=/data/tegata.db
      - AUTHELIA_USERS_FILE=/authelia-config/users_database.yml
      - AUTHELIA_CONFIG_FILE=/authelia-config/configuration.yml
      # Hops between the client and Tegata whose X-Forwarded-For is trusted;
      # the login fence judges that address, so get it right. One proxy in
      # front: 1. Two (e.g. Cloudflare + your proxy): 2. Straight to the port,
      # no proxy: 0. Or a list of proxy IPs/CIDRs. See README.md.
      - TRUST_PROXY=1
    volumes:
      - tegata-data:/data
      # The same directory Authelia mounts, read-write: Tegata is the writer
      # of users_database.yml and only ever reads configuration.yml.
      - ./authelia/config:/authelia-config
    # Reach Tegata from your proxy over a shared docker network, or publish the
    # port (3000) when the proxy runs on the host:
    # ports:
    #   - "127.0.0.1:3000:3000"
    # Tegata shares Authelia's root-owned 0600 users_database.yml, so it runs
    # as uid 0 like Authelia does; what root can do is cut down instead: no
    # capabilities, no privilege escalation, and nothing writable outside the
    # two mounts and /tmp. If Authelia runs as another uid (PUID/PGID), run
    # Tegata as that uid and make the users file and /data writable by it:
    # user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  tegata-data:
